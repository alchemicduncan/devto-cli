[project]
name = "devto-cli"
version = "0.1.0"
description = "CLI for publishing and interacting with the dev.to API"
authors = [
    { email = "dacampbell05@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.8",
    "httpx>=0.28.1",
]

[project.scripts]
devto = "devto_cli.cli:cli"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"
